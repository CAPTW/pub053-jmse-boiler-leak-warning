[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pub053-jmse-boiler-leak-warning"
version = "0.1.0"
description = "Companion verification, physics-core snapshot (ab4), and citation archive for the PUB-053 JMSE manuscript."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT (for code components; optional upstream dependency iapws is GPL-3.0 — see LICENSE and THIRD_PARTY_NOTICES.md)" }
dependencies = [
  "numpy>=1.24,<2.0",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "pyarrow>=14.0,<20.0",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "lxml>=5.0",
  "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
thermo = ["iapws>=1.5"]
docx = ["python-docx>=1.1"]
